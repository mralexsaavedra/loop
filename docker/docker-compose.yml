# LOOP server (docs/lan-services.md -> The stack — `docker/`): the database, the loop-server image, which ingests
# the iOS Shortcut / Strava data AND builds + publishes the page in the container (no clone, Node, cron or systemd
# on the host), and the loop-web image (nginx with the audited services/loop-web config) serving that page on the LAN
# and proxying its few data routes. Copy .env.example to .env next to this file, fill it in, then `docker compose up -d`.
#
# HC_INSTANCE (in .env, empty by default) names a second install on the same host, e.g. `second`: it suffixes the
# compose project, the container names, the volumes and the network, so two installs never share any of them.
# The names are the ones services/loop-ingest uses today, on purpose: the database volume carries over, and the old
# and the new stack can never run at the same time on one host (the container names collide).
name: loop-server${HC_INSTANCE:+-${HC_INSTANCE}}

# Container hardening (scripts/loop-server-compose.test.mjs pins it): a read-only root filesystem with tmpfs for
# the paths each one writes, every Linux capability dropped except the few its entrypoint needs, no privilege gain
# through setuid binaries, memory / CPU / process limits, and rotated logs (3 x 10 MB per container).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  loop-db:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    container_name: loop-db${HC_INSTANCE:+-${HC_INSTANCE}}
    restart: unless-stopped
    # Postgres writes only its data volume, its socket dir and /tmp. The entrypoint starts as root to own those
    # by the postgres user (CHOWN, DAC_READ_SEARCH), then drops to that user with gosu (SETUID, SETGID).
    read_only: true
    tmpfs:
      - /var/run/postgresql:size=1m
      - /tmp:size=64m
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_READ_SEARCH, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 2
    pids_limit: 256
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - loop-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  loop-server:
    # the published image (Docker Hub); `docker compose up -d --build` builds it from a clone instead
    image: mralexandersaavedra/loop-server:${HC_VERSION:-1.0.0}
    build:
      context: ..
      dockerfile: docker/loop-server.Dockerfile
      args:
        VERSION: ${HC_VERSION:-1.0.0}
    container_name: loop-server${HC_INSTANCE:+-${HC_INSTANCE}}
    restart: unless-stopped
    # SIGTERM lets in-flight requests finish for up to 10 s and stops a running build; docker waits this long
    stop_grace_period: 20s
    # an init process reaps the page build's grandchildren (astro, esbuild) if a build is killed
    init: true
    # runs as the image's `node` user and writes only its volumes, /tmp (the build output) and Astro's caches
    read_only: true
    tmpfs:
      - /tmp:size=256m,uid=1000,gid=1000
      - /app/.astro:size=64m,uid=1000,gid=1000
      - /app/web/.astro:size=16m,uid=1000,gid=1000
      - /app/web/node_modules:size=128m,uid=1000,gid=1000
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # the page build (astro) is the peak: room for it next to the uploads MAX_BODY_BYTES buffers
    mem_limit: 1536m
    cpus: 2
    pids_limit: 256
    logging: *logging
    environment:
      PORT: 8088
      # the database as separate fields, never a URL built here (any character works in POSTGRES_PASSWORD)
      DB_HOST: loop-db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      INGEST_TOKEN: ${INGEST_TOKEN}
      STRAVA_CLIENT_ID: ${STRAVA_CLIENT_ID:-}
      STRAVA_CLIENT_SECRET: ${STRAVA_CLIENT_SECRET:-}
      STRAVA_REFRESH_TOKEN: ${STRAVA_REFRESH_TOKEN:-}
      STRAVA_SYNC_MINUTES: ${STRAVA_SYNC_MINUTES:-30}
      FOOD_ALLOWED_HOSTS: ${FOOD_ALLOWED_HOSTS:-}
      # the in-container build (the image sets HC_BUILD=container, HC_DATA_DIR=/data, HC_SITE_DIR=/site)
      HC_REFRESH_MINUTES: ${HC_REFRESH_MINUTES:-60}
      # the Health import (scripts/import-health.mjs: the newest iPhone zip in files/import) before every sync: its
      # own timeout in seconds (a first import of a large export takes minutes); a failure never blocks the page
      HC_IMPORT_TIMEOUT: ${HC_IMPORT_TIMEOUT:-1800}
      HC_IMPORT_MAX_BYTES: ${HC_IMPORT_MAX_BYTES:-10737418240}
    volumes:
      # internal state: the processed extract, the document copies, the sync state
      - loop-server-data:/data
      # the published page + status.json + manuales/ (loop-web serves it read-only)
      - loop-site:/site
      # the owner files folder on the host (import/ Health exports, manuals/ device manuals, documents/ coach PDFs),
      # read-only: the server only reads it (the Health import works in /data/import-work), so a root-owned folder works
      - ${HC_FILES_LOCATION:-./files}:/data/files:ro
    # INGEST_PORT is required (a missing one fails here instead of publishing a random port): the iOS Shortcut and
    # the coach's `npm run sync` call it. INGEST_BIND=127.0.0.1 publishes on loopback only, the recommended
    # hardening; Docker-published ports bypass ufw / firewalld. Unset = every address.
    ports:
      - "${INGEST_BIND:+${INGEST_BIND}:}${INGEST_PORT:?set INGEST_PORT in docker/.env}:8088"
    networks:
      default:
        # loop-web's nginx template proxies to loop-ingest:8088 and the service's Host allowlist names loop-ingest:
        # the alias keeps both unchanged (single source with the host-mode stack)
        aliases: [loop-ingest]
    depends_on:
      loop-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8088/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  loop-web:
    # the published image (Docker Hub); `docker compose up -d --build` builds it from a clone instead. The nginx
    # template and hosts.sh are baked in from services/loop-web (docker/loop-web.Dockerfile), never bind-mounted.
    image: mralexandersaavedra/loop-web:${HC_VERSION:-1.0.0}
    build:
      context: ..
      dockerfile: docker/loop-web.Dockerfile
      args:
        VERSION: ${HC_VERSION:-1.0.0}
    container_name: loop-web${HC_INSTANCE:+-${HC_INSTANCE}}
    restart: unless-stopped
    # The same hardening as services/loop-web/docker-compose.yml: a read-only root filesystem; tmpfs for what the
    # entrypoint and nginx write (the rendered template + hosts map in conf.d, the pid file, the temp dirs); only
    # the capabilities the nginx master needs to own the workers' temp dirs (CHOWN) and drop the workers to the
    # nginx user (SETUID, SETGID; without any of the three it does not serve); port 80 needs no NET_BIND_SERVICE
    # (Docker >= 20.10 lets containers bind low ports); no privilege gain; limits; rotated logs.
    read_only: true
    tmpfs:
      - /etc/nginx/conf.d:size=1m
      - /var/cache/nginx:size=32m
      - /run:size=1m
      - /tmp:size=16m
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 128
    logging: *logging
    environment:
      # extra host names the page may be reached by (besides IP literals and localhost), comma or space separated;
      # rendered by hosts.sh. Mirror them in FOOD_ALLOWED_HOSTS (loop-server).
      PLAN_WEB_EXTRA_HOSTS: ${PLAN_WEB_EXTRA_HOSTS:-}
    volumes:
      # only the published page is served, read-only: nothing else of the server's data is reachable over HTTP
      - loop-site:/usr/share/nginx/html:ro
    # PLAN_WEB_BIND (optional, e.g. the LAN IP or 127.0.0.1; an IPv6 address in brackets) publishes on that address
    # only: Docker-published ports bypass ufw / firewalld. Unset = every address (the page is the LAN entry).
    ports:
      - "${PLAN_WEB_BIND:+${PLAN_WEB_BIND}:}${PLAN_WEB_PORT:-8090}:80"
    depends_on:
      loop-server:
        condition: service_healthy
    healthcheck:
      # nginx answers /nginx-health itself (nginx.conf.template), whatever the site volume holds
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  loop-db-data:
    # the same explicit name as services/loop-ingest's: the database carries over to this stack
    name: loop-db-data${HC_INSTANCE:+-${HC_INSTANCE}}
  loop-server-data:
    name: loop-server-data${HC_INSTANCE:+-${HC_INSTANCE}}
  loop-site:
    name: loop-site${HC_INSTANCE:+-${HC_INSTANCE}}

networks:
  default:
    # a fixed name (not <project>_default), the one services/loop-ingest + services/loop-web use today
    name: loop-net${HC_INSTANCE:+-${HC_INSTANCE}}
