# A `vX.Y.Z` tag publishes the two LOOP server images to Docker Hub for amd64 and arm64, built from the repo root:
# mralexandersaavedra/loop-server (docker/loop-server.Dockerfile) and mralexandersaavedra/loop-web
# (docker/loop-web.Dockerfile), each as X.Y.Z, X.Y and, for the highest release only, latest. The host-mode data
# service image (loop-ingest) is no longer published; it still builds from a clone. Checklist: docs/development.md -> Releasing.
# Needs two repository settings: the variable DOCKERHUB_USERNAME and the secret DOCKERHUB_TOKEN
# (a Docker Hub access token with read/write scope, never the account password).
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  # Nothing is pushed unless one plain X.Y.Z version is everywhere: the tag, package.json, the image tag default of
  # every loop-server / loop-web `image:` line in docker/docker-compose.yml and docker/.env.example (what
  # `docker compose pull` fetches), and the FIRST version heading of CHANGELOG.md, dated (`## [X.Y.Z] - UNRELEASED`
  # refuses the release); and the tagged commit must be on main. A pre-release or non-semver version is refused, so a
  # release always pushes X.Y.Z and X.Y. `latest` moves only when this version is the highest X.Y.Z tag in the repo:
  # a backport tag (v1.0.5 after v1.1.0) publishes 1.0.5 and 1.0 but leaves latest on 1.1.0.
  # scripts/release.test.mjs runs this script against good and bad scratch repos.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      latest: ${{ steps.version.outputs.latest }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: One plain X.Y.Z everywhere, a dated CHANGELOG heading, a commit on main; is it the newest release?
        id: version
        run: |
          v="$(node -p "require('./package.json').version")"
          [[ "${v}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "package.json version ${v} is not a plain X.Y.Z release (no pre-release or build suffix)"; exit 1; }
          test "${GITHUB_REF_NAME}" = "v${v}" || { echo "tag ${GITHUB_REF_NAME} != v${v} (package.json)"; exit 1; }
          defaults="$(grep -o 'HC_VERSION:-[^}]*' docker/docker-compose.yml | sort -u)"
          test "${defaults}" = "HC_VERSION:-${v}" || { echo "docker/docker-compose.yml HC_VERSION defaults: ${defaults} != ${v}"; exit 1; }
          images="$(grep -E '^[[:space:]]*image:.*loop-(server|web)' docker/docker-compose.yml || true)"
          good="$(grep -xE "[[:space:]]*image: mralexandersaavedra/loop-(server|web):[$][{]HC_VERSION:-${v//./[.]}[}]" <<<"${images}" || true)"
          test "${images}" = "${good}" && test "$(grep -c . <<<"${good}")" = 2 || { echo "docker/docker-compose.yml: every loop-server / loop-web image line must be mralexandersaavedra/<image>:\${HC_VERSION:-${v}}, got:"; echo "${images}"; exit 1; }
          grep -qxF "HC_VERSION=${v}" docker/.env.example || { echo "docker/.env.example HC_VERSION != ${v}"; exit 1; }
          first="$(grep -m1 -E '^## \[' CHANGELOG.md || true)"
          [[ "${first}" =~ ^"## [${v}] - "[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "CHANGELOG.md: the first version heading is '${first}', not '## [${v}] - YYYY-MM-DD' (still UNRELEASED?)"; exit 1; }
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main || { echo "the tagged commit ${GITHUB_SHA} is not on main (origin/main)"; exit 1; }
          newest="$({ git tag -l 'v*' | sed -n 's/^v\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)$/\1/p'; echo "${v}"; } | sort -t. -k1,1n -k2,2n -k3,3n | tail -n1)"
          latest=false; test "${newest}" = "${v}" && latest=true
          echo "latest=${latest}" >> "${GITHUB_OUTPUT}"
          echo "version=${v}" >> "${GITHUB_OUTPUT}"
          echo "v${v}: newest X.Y.Z release ${newest}, latest=${latest}"

  # The whole CI (lint, typecheck, both suites, the data service on Postgres, both images built + smoke-tested) on the
  # tagged commit: nothing is pushed unless it passes.
  test:
    uses: ./.github/workflows/ci.yml

  # Each architecture builds on a native runner (no QEMU: emulated arm64 crashed Node with "Illegal instruction" during
  # npm ci) and is pushed by digest only; the merge job then tags one multi-arch manifest per image.
  build:
    needs: [check, test]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        image: [loop-server, loop-web]
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: mralexandersaavedra/${{ matrix.image }}
          # only for the OCI labels: without a semver tag rule the version label would be the git tag name (v1.0.0)
          tags: type=semver,pattern={{version}}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ needs.check.outputs.version }}
          outputs: type=image,name=mralexandersaavedra/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.image }}-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  image:
    needs: [check, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        image: [loop-server, loop-web]
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: digests
          pattern: digest-${{ matrix.image }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: mralexandersaavedra/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ needs.check.outputs.latest == 'true' }}
          # the only latest is the one above: metadata-action would otherwise add it to every semver tag
          flavor: latest=false
      - name: Tag one manifest for both architectures
        working-directory: digests
        env:
          IMAGE: mralexandersaavedra/${{ matrix.image }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          test "$(ls | wc -l)" -eq 2
          args=()
          for t in $TAGS; do args+=(-t "$t"); done
          docker buildx imagetools create "${args[@]}" $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:${{ needs.check.outputs.version }}"
