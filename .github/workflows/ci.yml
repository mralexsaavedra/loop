# Lint, the lib/ typecheck and both test suites on every push and pull request, plus the data service against a real
# Postgres (job `postgres`) and the two server images built and smoke-tested on a minimal compose stack (job `images`).
# The suites need no personal data: a fresh clone passes (the personal-only checks skip themselves). release.yml calls
# this whole workflow (workflow_call) and pushes nothing unless every job here passes.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            services/loop-ingest/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:services

  # The data service against a real Postgres (services/loop-ingest/test/pg): the real migrations on an empty
  # database, the ledger + advisory lock, and the main DB paths. Same image and digest as the compose file
  # (scripts/release.test.mjs checks it).
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: services/loop-ingest/package-lock.json
      - run: npm run test:pg

  # Both server images (docker/loop-server.Dockerfile, docker/loop-web.Dockerfile) built for linux/amd64, never pushed,
  # and a minimal compose stack of docker/docker-compose.yml: loop-server /healthz, the first published status.json,
  # GET / 200 over 100 KB, then down -v (scripts/image-smoke.sh).
  images:
    # both architectures on native runners, like the release (the arm64 image is never emulated)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/image-smoke.sh
        env:
          SMOKE_PLATFORM: ${{ matrix.platform }}
