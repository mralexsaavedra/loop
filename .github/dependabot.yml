# Weekly update PRs: npm (page/tooling and the data service), the pinned base image digests, the pinned actions.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      dev-dependencies: { dependency-type: development }
  - package-ecosystem: npm
    directory: /services/loop-ingest
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /services/loop-ingest
    schedule: { interval: weekly }
    ignore:
      # Major versions of the runtime and the database are planned upgrades, never a weekly bump: Node stays on the
      # LTS line pinned in .nvmrc, and a new Postgres major cannot open the old data directory (dump and restore).
      - dependency-name: node
        update-types: [version-update:semver-major]
      - dependency-name: postgres
        update-types: [version-update:semver-major]
      - dependency-name: nginx
        update-types: [version-update:semver-major]
  - package-ecosystem: docker-compose
    directories: [/services/loop-ingest, /services/loop-web]
    schedule: { interval: weekly }
    ignore:
      # Major versions of the runtime and the database are planned upgrades, never a weekly bump: Node stays on the
      # LTS line pinned in .nvmrc, and a new Postgres major cannot open the old data directory (dump and restore).
      - dependency-name: node
        update-types: [version-update:semver-major]
      - dependency-name: postgres
        update-types: [version-update:semver-major]
      - dependency-name: nginx
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
