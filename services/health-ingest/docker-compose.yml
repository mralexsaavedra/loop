services:
  health-db:
    image: postgres:17-alpine
    container_name: health-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - health-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  health-ingest:
    build: .
    container_name: health-ingest
    restart: unless-stopped
    environment:
      PORT: 8088
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@health-db:5432/${POSTGRES_DB}
      INGEST_TOKEN: ${INGEST_TOKEN}
      STRAVA_CLIENT_ID: ${STRAVA_CLIENT_ID:-}
      STRAVA_CLIENT_SECRET: ${STRAVA_CLIENT_SECRET:-}
      STRAVA_REFRESH_TOKEN: ${STRAVA_REFRESH_TOKEN:-}
      STRAVA_SYNC_MINUTES: ${STRAVA_SYNC_MINUTES:-30}
    ports:
      - "${INGEST_PORT}:8088"
    depends_on:
      health-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8088/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  health-web:
    build: ../web
    container_name: health-web
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@health-db:5432/${POSTGRES_DB}
    ports:
      - "${WEB_PORT:-3001}:3000"
    depends_on:
      health-db:
        condition: service_healthy

volumes:
  health-db-data:
