# HC_INSTANCE (in .env, empty by default) names a second install on the same host, e.g. `second`: it
# suffixes the compose project, the container names and the database volume, so two installs never
# share a container or a database. Empty = the plain names below.
name: loop-ingest${HC_INSTANCE:+-${HC_INSTANCE}}

# Container hardening (both services; scripts/loop-web-config.test.mjs pins it): a read-only root filesystem with
# tmpfs for the paths each one writes, every Linux capability dropped except the few its entrypoint needs, no
# privilege gain through setuid binaries, memory / CPU / process limits sized generously for a small host, and
# rotated logs (3 x 10 MB per container).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  loop-db:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    container_name: loop-db${HC_INSTANCE:+-${HC_INSTANCE}}
    restart: unless-stopped
    # Postgres writes only its data volume, its socket dir and /tmp. The entrypoint starts as root to own those
    # by the postgres user (CHOWN, plus DAC_READ_SEARCH for its `find` in the postgres-owned data dir), then drops
    # to that user with gosu (SETUID, SETGID). Each one was checked: without it the container does not start.
    read_only: true
    tmpfs:
      - /var/run/postgresql:size=1m
      - /tmp:size=64m
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_READ_SEARCH, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    # shared_buffers defaults to 128 MB; /dev/shm (docker default 64 MB) is enough for this small database
    mem_limit: 1g
    cpus: 2
    pids_limit: 256
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - loop-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  loop-ingest:
    # the published image (Docker Hub); `docker compose up -d --build` builds it from this clone instead
    image: mralexandersaavedra/loop-ingest:${HC_VERSION:-1.0.0}
    build: .
    container_name: loop-ingest${HC_INSTANCE:+-${HC_INSTANCE}}
    restart: unless-stopped
    # SIGTERM lets in-flight requests finish for up to 10 s (src/server.js SHUTDOWN_DEADLINE_MS), then
    # closes the pool; docker waits this long before SIGKILL
    stop_grace_period: 20s
    # runs as the image's `node` user and writes only /trigger (bind mount): no capability at all
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # MAX_BODY_BYTES (8 MB) is buffered and parsed in memory: room for a few uploads at once
    mem_limit: 512m
    cpus: 1
    pids_limit: 128
    logging: *logging
    environment:
      PORT: 8088
      # the database as separate fields, never a URL built here: a POSTGRES_PASSWORD with @ : / ? # % then
      # works as is (src/server.js databaseConfig; a DATABASE_URL, when set, still wins)
      DB_HOST: loop-db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      INGEST_TOKEN: ${INGEST_TOKEN}
      STRAVA_CLIENT_ID: ${STRAVA_CLIENT_ID:-}
      STRAVA_CLIENT_SECRET: ${STRAVA_CLIENT_SECRET:-}
      STRAVA_REFRESH_TOKEN: ${STRAVA_REFRESH_TOKEN:-}
      STRAVA_SYNC_MINUTES: ${STRAVA_SYNC_MINUTES:-30}
      TRIGGER_DIR: /trigger
      # extra host names for the /food/* Host + Origin checks (IP literals, localhost and
      # host.docker.internal always pass); mirror loop-web's PLAN_WEB_EXTRA_HOSTS
      FOOD_ALLOWED_HOSTS: ${FOOD_ALLOWED_HOSTS:-}
    # POST /sync writes /trigger/refresh; the host watches ./trigger/refresh with
    # services/loop-web/systemd/loop-web-refresh.path. The container runs as the
    # image's `node` user (uid 1000): chown the host dir to 1000 (see README).
    volumes:
      - ./trigger:/trigger
    # INGEST_PORT is required (a missing one fails here instead of publishing a random port). INGEST_BIND
    # (optional, e.g. the LAN IP or 127.0.0.1; an IPv6 address in brackets) publishes on that address only:
    # Docker-published ports bypass ufw / firewalld. Unset = every address, as before.
    ports:
      - "${INGEST_BIND:+${INGEST_BIND}:}${INGEST_PORT:?set INGEST_PORT in services/loop-ingest/.env}:8088"
    depends_on:
      loop-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8088/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  loop-db-data:
    # An explicit name, so the database volume no longer depends on the compose project name:
    # renaming the project (or the folder) never orphans the data again.
    name: loop-db-data${HC_INSTANCE:+-${HC_INSTANCE}}
