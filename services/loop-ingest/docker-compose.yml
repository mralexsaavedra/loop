# HC_INSTANCE (in .env, empty by default) names a second install on the same host, e.g. `second`: it
# suffixes the compose project, the container names and the database volume, so two installs never
# share a container or a database. Empty = the plain names below.
name: loop-ingest${HC_INSTANCE:+-${HC_INSTANCE}}
services:
  loop-db:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    container_name: loop-db${HC_INSTANCE:+-${HC_INSTANCE}}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - loop-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  loop-ingest:
    # the published image (Docker Hub); `docker compose up -d --build` builds it from this clone instead
    image: mralexandersaavedra/loop-ingest:${HC_VERSION:-1.0.0}
    build: .
    container_name: loop-ingest${HC_INSTANCE:+-${HC_INSTANCE}}
    restart: unless-stopped
    environment:
      PORT: 8088
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@loop-db:5432/${POSTGRES_DB}
      INGEST_TOKEN: ${INGEST_TOKEN}
      STRAVA_CLIENT_ID: ${STRAVA_CLIENT_ID:-}
      STRAVA_CLIENT_SECRET: ${STRAVA_CLIENT_SECRET:-}
      STRAVA_REFRESH_TOKEN: ${STRAVA_REFRESH_TOKEN:-}
      STRAVA_SYNC_MINUTES: ${STRAVA_SYNC_MINUTES:-30}
      TRIGGER_DIR: /trigger
      # extra host names for the /food/* Host + Origin checks (IP literals, localhost and
      # host.docker.internal always pass); mirror loop-web's PLAN_WEB_EXTRA_HOSTS
      FOOD_ALLOWED_HOSTS: ${FOOD_ALLOWED_HOSTS:-}
    # POST /sync writes /trigger/refresh; the host watches ./trigger/refresh with
    # services/loop-web/systemd/loop-web-refresh.path. The container runs as the
    # image's `node` user (uid 1000): chown the host dir to 1000 (see README).
    volumes:
      - ./trigger:/trigger
    ports:
      - "${INGEST_PORT}:8088"
    depends_on:
      loop-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8088/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  loop-db-data:
    # An explicit name, so the database volume no longer depends on the compose project name:
    # renaming the project (or the folder) never orphans the data again.
    name: loop-db-data${HC_INSTANCE:+-${HC_INSTANCE}}
