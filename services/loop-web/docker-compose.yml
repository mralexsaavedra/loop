# Serves the Astro-built plan page (web/dist/personal/index.html) on the LAN.
# refresh.sh rebuilds it and copies the output into ./site; only that
# directory is mounted, so nothing else under data/ or web/ is reachable
# over HTTP. /api/sync, /api/sync/status, /api/food/*, /api/journal/* and
# /ingest/health-auto-export (and nothing else) are proxied to the loop-ingest
# service over the ingest stack's network (loop-net, below), and only requests
# naming an allowed Host are answered, see nginx.conf.template.
# Variables: services/loop-web/.env.example (all optional).
# HC_INSTANCE (in .env, empty by default): a second install on the same host, e.g. `second`
# (services/loop-web/README.md -> Running a second install). Empty = the plain names.
name: loop-web${HC_INSTANCE:+-${HC_INSTANCE}}
services:
  loop-web:
    image: nginx:alpine@sha256:892bb2152464f0c5d8972593a5f5afaf8054552580b699d95f8ff4af08c2d33d
    container_name: loop-web${HC_INSTANCE:+-${HC_INSTANCE}}
    restart: unless-stopped
    # PLAN_WEB_BIND (optional, e.g. the LAN IP or 127.0.0.1; an IPv6 address in brackets) publishes on that
    # address only: Docker-published ports bypass ufw / firewalld. Unset = every address, as before.
    ports:
      - "${PLAN_WEB_BIND:+${PLAN_WEB_BIND}:}${PLAN_WEB_PORT:-8090}:80"
    environment:
      # extra host names the page may be reached by (besides IP literals and localhost), comma or
      # space separated; rendered by hosts.sh. Mirror them in loop-ingest's FOOD_ALLOWED_HOSTS.
      PLAN_WEB_EXTRA_HOSTS: ${PLAN_WEB_EXTRA_HOSTS:-}
    # Hardening (scripts/loop-web-config.test.mjs pins it): read-only root filesystem; tmpfs for what the
    # entrypoint and nginx write (the rendered template + hosts map in conf.d, the pid file, the temp dirs);
    # only the capabilities the nginx master needs to own the workers' temp dirs (CHOWN) and drop the workers to
    # the nginx user (SETUID, SETGID; without any of the three it does not serve); port 80 needs no
    # NET_BIND_SERVICE (Docker >= 20.10 lets containers bind low ports); no privilege gain; generous limits;
    # rotated logs.
    read_only: true
    tmpfs:
      - /etc/nginx/conf.d:size=1m
      - /var/cache/nginx:size=32m
      - /run:size=1m
      - /tmp:size=16m
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      # nginx answers /nginx-health itself (nginx.conf.template), whatever ./site holds
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./hosts.sh:/docker-entrypoint.d/15-hc-hosts.sh:ro

# The ingest stack's network, created by `docker compose up` in services/loop-ingest (start that stack
# first; without it this one stops with "network loop-net declared as external, but could not be found").
# nginx reaches the service as loop-ingest:8088 on it, so the ingest port's host publish (INGEST_BIND) never
# matters here. A second install (HC_INSTANCE) joins its own loop-net-<instance>.
networks:
  default:
    name: loop-net${HC_INSTANCE:+-${HC_INSTANCE}}
    external: true
