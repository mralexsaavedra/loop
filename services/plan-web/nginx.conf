# plan-web.html declares no charset (the artifact host supplies one), so nginx
# must send it or browsers fall back to Latin-1 and garble accents and emoji.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Always revalidate: the page is regenerated hourly.
    add_header Cache-Control "no-cache";
}
